<!DOCTYPE html>
<html>
<head>
    <title>College Partners</title>

    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="owl.carousel.min.css">
    <link rel="stylesheet" href="owl.theme.default.min.css">

    <link rel="stylesheet" href="style.css">
    <style>
        /* ===============================
   SECTION STYLE
=================================*/

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.rs-brand {
    padding: 80px 0;
    background: #f3f3f3;
}

.container {
    width: 1140px;
    margin: auto;
}

/* ===============================
   TITLE STYLE (Orange Like Image)
=================================*/

.section-title {
    margin-bottom: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.section-title h2 {
    font-size: 28px;
    font-weight: 600;
    color: #f26522;   /* ORANGE COLOR */
    margin: 0;
}

.section-title .icon {
    color: #f26522;
    font-weight: bold;
    font-size: 20px;
}

/* ===============================
   SLIDER STYLE
=================================*/

.brand-item {
    display: flex;
    justify-content: center;
    align-items: center;
}

.brand-item img {
    max-height: 140px;
    width: auto;
    object-fit: contain;
    transition: none !important;
}

/* Remove hover */
.brand-item:hover img {
    transform: none !important;
}

/* ===============================
   RESPONSIVE
=================================*/

@media (max-width: 1200px) {
    .container {
        width: 95%;
    }
}

@media (max-width: 768px) {
    .section-title h2 {
        font-size: 22px;
    }

    .brand-item img {
        max-height: 100px;
    }
}
    </style>
</head>
<body>

<!--======== Brand Start ========-->
<div class="rs-brand">
    <div class="container">

        <!-- Section Title -->
        <div class="section-title text-center">
            <span class="icon">~^~</span>
            <h2>Our College Partners</h2>
            <span class="icon">~^~</span>
        </div>

        <!-- Slider -->
        <div class="rs-brand__slider">
            <div class="owl-carousel brand-carousel">

                <div class="brand-item">
                    <img src="assets/images/brand/image-Photoroom (1).png" alt="">
                </div>

                <div class="brand-item">
                    <img src="assets/images/brand/image-Photoroom.png" alt="">
                </div>

                <div class="brand-item">
                    <img src="assets/images/brand/images-Photoroom (1).png" alt="">
                </div>

                <div class="brand-item">
                    <img src="assets/images/brand/logo-896x1024-Photoroom.png" alt="">
                </div>

                <div class="brand-item">
                    <img src="assets/images/brand/university-college-school-badge-logo-free-vector-Photoroom.png" alt="">
                </div>

                <div class="brand-item">
                    <img src="assets/images/brand/University-Logo-backup-Photoroom.png" alt="">
                </div>

            </div>
        </div>

    </div>
</div>
<!--======== Brand End ========-->

<!-- jQuery -->
<script src="jquery.min.js"></script>

<!-- Owl Carousel JS -->
<script src="owl.carousel.min.js"></script>

<script>
$('.brand-carousel').owlCarousel({
    loop: true,
    margin: 40,
    autoplay: true,
    autoplayTimeout: 2500,
    autoplayHoverPause: false,
    smartSpeed: 800,
    dots: false,
    nav: false,
    responsive:{
        0:{ items:2 },
        576:{ items:3 },
        768:{ items:4 },
        992:{ items:5 },
        1200:{ items:5 }
    }
});
</script>

</body>
</html>
