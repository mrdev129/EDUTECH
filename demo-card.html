<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f2f2f2;
}

@keyframes slide {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-100%);
  }
}

.logos {
  overflow: hidden;
  padding: 60px 0;
  background: white;
  white-space: nowrap;
  position: relative;
}

.logos:before,
.logos:after {
  position: absolute;
  top: 0;
  width: 400px;
  height: 250%;
  content: "";
  z-index: 2;
}

.logos:before {
  left: 0;
  background: linear-gradient(to left, rgba(255, 255, 255, 0), white);
}

.logos:after {
  right: 0;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), white);
}

.logos:hover .logos-slide {
  animation-play-state: paused;
}

.logos-slide {
  display: inline-block;
  animation: 30s slide infinite linear;
}

.logos-slide img {
  height: 100px;
  margin: 0 40px;
}


    </style>
</head>
<body>
  <div class="logos">
  <div class="logos-slide">
    <img src="assets/images/brand/bits.png" />
    <img src="assets/images/brand/christ.jpeg" />
    <img src="assets/images/brand/cvraman.png" />
    <img src="assets/images/brand/kiit.png" />
    <img src="assets/images/brand/manipal.png" />
    <img src="assets/images/brand/rv.png" />
    <img src="assets/images/brand/soa.png" />
    <img src="assets/images/brand/srm.png" />
    <img src="assets/images/brand/vit.jpg" />
  </div>
  <div class="logos-slide">
    <img src="assets/images/brand/bits.png" />
    <img src="assets/images/brand/christ.jpeg" />
    <img src="assets/images/brand/cvraman.png" />
    <img src="assets/images/brand/kiit.png" />
    <img src="assets/images/brand/manipal.png" />
    <img src="assets/images/brand/rv.png" />
    <img src="assets/images/brand/soa.png" />
    <img src="assets/images/brand/srm.png" />
    <img src="assets/images/brand/vit.jpg" />
  </div>
  
</div>

</body>
</html>
